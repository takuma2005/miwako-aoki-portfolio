<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ページが見つかりません｜青木みわこ</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; min-height: 100svh;
            display: grid; place-items: center;
            background: #FBF7F4; color: #3D3733;
            font-family: 'Noto Sans JP', sans-serif;
            text-align: center; line-height: 1.9;
        }
        .code {
            font-family: 'Shippori Mincho', serif;
            font-size: 5rem; color: #D97D63; margin: 0;
        }
        h1 { font-family: 'Shippori Mincho', serif; font-size: 1.3rem; letter-spacing: 0.1em; margin: 0.5rem 0 1rem; }
        p { font-size: 0.9rem; color: #7A6F68; margin: 0 1.5rem 2rem; }
        a {
            display: inline-block; padding: 0.9em 2.4em;
            background: #D97D63; color: #fff; text-decoration: none;
            border-radius: 999px; font-size: 0.9rem; letter-spacing: 0.08em;
        }
        a:hover { background: #C2664D; }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>ページが見つかりません</h1>
        <p>お探しのページは移動または削除された可能性があります。</p>
        <a href="/">トップページへ戻る</a>
    </main>
</body>
</html>
